---
# role: chronyd
# file: vars/Suse.yml

__chronyd_packages:
  - chrony
  - timezone
__chronyd_remove_packages:
  - ntp
__chronyd_options_file: /etc/sysconfig/chronyd
__chronyd_options_variable: OPTIONS
__chronyd_options_defaults: []
__chronyd_conf: /etc/chrony.conf
__chronyd_service: chronyd
__chronyd_conflicting_services:
  - systemd-timesyncd
# Pipe the candidate to avoid AppArmor denying Ansible's temporary path.
__chronyd_validate: >-
  /bin/bash -o pipefail -c
  'cat "$1" | /usr/sbin/chronyd -p -f /dev/stdin' -- %s
