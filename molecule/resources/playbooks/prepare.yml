---
# role: chronyd
# file: molecule/resources/playbooks/prepare.yml

- name: "CHRONYD | Prepare containers without changing the host clock"
  hosts: all
  gather_facts: true
  tasks:
    - name: "CHRONYD | Load platform service paths"
      ansible.builtin.include_vars: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}/vars/{{ ansible_facts.os_family }}.yml"

    - name: "CHRONYD | Refresh Debian package metadata"
      ansible.builtin.apt:
        update_cache: true
      when: ansible_facts.pkg_mgr == 'apt'

    - name: "CHRONYD | Create test service override directory"
      ansible.builtin.file:
        path: "/etc/systemd/system/{{ __chronyd_service }}.service.d"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: "CHRONYD | Run the test daemon without clock control"
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ __chronyd_service }}.service.d/molecule.conf"
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          ConditionCapability=
          ConditionVirtualization=
          [Service]
          Type=simple
          ExecStart=
          ExecStart=!/usr/sbin/chronyd -n -x -f {{ __chronyd_conf }} ${{ __chronyd_options_variable }}

    - name: "CHRONYD | Load test service overrides"
      ansible.builtin.systemd_service:
        daemon_reload: true
