---
# role: chronyd
# file: molecule/resources/playbooks/side_effect.yml

- name: "CHRONYD | Exercise server changes and service recovery"
  hosts: all
  gather_facts: true
  vars:
    chronyd_port: 1123
    chronyd_bindaddress: "127.0.0.1"
    chronyd_directives:
      - allow 127.0.0.0/8
      - local stratum 10
    chronyd_deny:
      - 127.0.0.2
  tasks:
    - name: "CHRONYD | Switch the running client to server mode"
      ansible.builtin.include_role:
        name: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}"
        public: true

    - name: "CHRONYD | Query effective server access rules"
      ansible.builtin.command:
        argv:
          - chronyc
          - -m
          - accheck 127.0.0.1
          - accheck 127.0.0.2
      changed_when: false
      register: __chronyd_access

    - name: "CHRONYD | Assert allowed and denied clients are distinguished"
      ansible.builtin.assert:
        that:
          - "'208 Access allowed' in __chronyd_access.stdout"
          - "'209 Access denied' in __chronyd_access.stdout"
        quiet: true

    - name: "CHRONYD | Verify NTP response and restricted IPv4 binding"
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import socket
            with socket.socket(socket.AF_INET, socket.SOCK_DGRAM) as probe:
                probe.settimeout(5)
                probe.sendto(bytes([35]) + bytes(47), ("127.0.0.1", 1123))
                reply, _ = probe.recvfrom(512)
                assert len(reply) >= 48 and reply[0] & 7 == 4, reply
            with socket.socket(socket.AF_INET, socket.SOCK_DGRAM) as probe:
                probe.bind(("127.0.0.2", 1123))
      changed_when: false

    - name: "CHRONYD | Stop and disable the configured service"
      ansible.builtin.service:
        name: "{{ __chronyd_service }}"
        state: stopped
        enabled: false

    - name: "CHRONYD | Restore the service with unchanged configuration"
      ansible.builtin.include_role:
        name: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}"

    - name: "CHRONYD | Verify the restored service and start options"
      ansible.builtin.import_tasks: ../tasks/verify_options.yml
      vars:
        __chronyd_expected_options: "{{ __chronyd_options_defaults }}"

- name: "CHRONYD | Append IPv4-only start options"
  hosts: all
  gather_facts: true
  vars:
    chronyd_options_mode: append
    chronyd_options: ["-4"]
    chronyd_ntp_pools: []
    chronyd_ntp_servers: []
    chronyd_port: 0
    chronyd_cmdport: 0
  roles:
    - role: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}"
  tasks:
    - name: "CHRONYD | Verify appended start options"
      ansible.builtin.import_tasks: ../tasks/verify_options.yml
      vars:
        __chronyd_expected_options: "{{ __chronyd_options_defaults + ['-4'] }}"

- name: "CHRONYD | Replace start options with IPv6-only"
  hosts: all
  gather_facts: true
  vars:
    chronyd_options_mode: replace
    chronyd_options: ["-6"]
    chronyd_ntp_pools: []
    chronyd_ntp_servers: []
    chronyd_port: 0
    chronyd_cmdport: 0
  roles:
    - role: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}"
  tasks:
    - name: "CHRONYD | Verify replaced start options"
      ansible.builtin.import_tasks: ../tasks/verify_options.yml
      vars:
        __chronyd_expected_options: ["-6"]
